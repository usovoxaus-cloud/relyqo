<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>Подробная оценка · Мой RELYQO</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 88% 0,#30206077,transparent 36%),#07111f;color:#eef8fa;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{width:min(1040px,100%);margin:auto;padding:22px 16px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px;font-weight:950;letter-spacing:.08em}.mark{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:#6de2bd;color:#05251d;font-size:24px}.back{color:#8de8ca;text-decoration:none;font-weight:900}.card{border:1px solid #2a4d62;border-radius:24px;background:#0a1d2d;padding:25px}.hidden{display:none!important}.error{padding:18px;border-radius:16px;background:#512231;color:#ffd6dc}.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}.eyebrow{margin:0;color:#79dfbd;font-size:11px;font-weight:950;letter-spacing:.15em}.hero h1{margin:8px 0;font-size:clamp(34px,7vw,62px);line-height:1}.description{margin:0;color:#9fb7c2;line-height:1.55}.status{display:inline-flex;margin-top:16px;padding:8px 12px;border:1px solid #765dcc;border-radius:999px;background:#281d55;color:#d8caff;font-size:11px;font-weight:950;letter-spacing:.05em}.score{text-align:right}.score strong{display:block;color:#6de2bd;font-size:clamp(56px,10vw,94px);line-height:.9}.score span{color:#a7bdc6}.date{margin-top:14px;color:#9eb5bf;font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:17px;margin-top:17px}.sectionTitle{margin:6px 0 4px;font-size:25px}.metrics{display:grid;gap:13px;margin-top:19px}.metricTop{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:850}.metricTop b{color:#d8ccff}.track{height:10px;margin-top:7px;border-radius:999px;background:#142f43;overflow:hidden}.fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,#6de2bd,#75a8ff)}.photo{overflow:hidden;padding:0}.photo img{display:block;width:100%;max-height:440px;object-fit:cover;background:#06121c}.photoCopy{padding:20px}.photoCopy h2{margin:0 0 10px}.analysis{margin:12px 0 0;padding:14px;border-radius:13px;background:#171f42;color:#ddd9ff;line-height:1.6}.noPhoto{min-height:230px;display:grid;place-items:center;padding:24px;color:#93aeb9;text-align:center}.principle{margin-top:17px;border-color:#59528d;background:#171a38;color:#ccc9e8;line-height:1.65}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:19px}.button{display:inline-flex;padding:12px 15px;border-radius:11px;background:#17394a;color:#c8efe4;text-decoration:none;font-weight:900}.button.primary{background:#6de2bd;color:#05251d}@media(max-width:760px){.hero,.layout{grid-template-columns:1fr}.score{text-align:left}.top{align-items:flex-start}.card{padding:20px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><span class="mark">R</span><span>МОЙ RELYQO</span></div><a class="back" href="/me">← История оценок</a></header>
    <div id="error" class="error hidden"></div>
    <section id="content" class="hidden">
      <section class="card hero">
        <div><p class="eyebrow">ПОДРОБНАЯ ОЦЕНКА</p><h1 id="name"></h1><p id="description" class="description"></p><span id="status" class="status"></span><p id="date" class="date"></p></div>
        <div class="score"><strong id="score"></strong><span id="scoreLabel"></span></div>
      </section>
      <div class="layout">
        <section class="card"><p class="eyebrow">КРИТЕРИИ СФЕРЫ</p><h2 class="sectionTitle">Как вы оценили услугу</h2><div id="metrics" class="metrics"></div><div class="actions"><a id="placeLink" class="button primary" href="/nearby">Открыть организацию</a><a class="button" href="/nearby">Вернуться к карте</a></div></section>
        <section id="photoCard" class="card photo"><div id="noPhoto" class="noPhoto">К этой оценке фотография не добавлялась.</div><div id="photoContent" class="hidden"><img id="photo" alt="Фотография к оценке"><div class="photoCopy"><h2>Фотография потребителя</h2><p id="analysis" class="analysis hidden"></p></div></div></section>
      </div>
      <section id="principle" class="card principle"></section>
    </section>
  </main>
  <script>
    const params=new URLSearchParams(location.search);const ratingId=params.get('rating_id');const $=id=>document.getElementById(id);
    const foodCategories=new Set(['FOOD','RESTAURANT','CAFE','COFFEE_SHOP','BAKERY','BAR','FOOD_COURT']);
    function categoryGroup(value){return foodCategories.has(value)?'FOOD':value}
    function labelsFor(category){const sets={FOOD:['Общее впечатление','Качество еды / продукта','Обслуживание','Чистота','Цена и ценность'],HOTEL:['Общее впечатление','Комфорт и состояние номера','Обслуживание','Чистота','Цена и ценность'],BEAUTY:['Результат','Качество процедуры','Мастер и обслуживание','Гигиена','Цена и ценность'],HEALTH:['Общее впечатление','Качество помощи','Внимание персонала','Гигиена и безопасность','Цена и прозрачность'],ENTERTAINMENT:['Впечатление','Качество программы / развлечения','Обслуживание','Состояние места','Цена и ценность'],RETAIL:['Общее впечатление','Ассортимент и качество товаров','Обслуживание','Порядок и удобство','Цена и ценность'],AUTO_SERVICE:['Общее впечатление','Качество работы','Сроки и обслуживание','Аккуратность','Цена и прозрачность'],PROFESSIONAL_SERVICE:['Общее впечатление','Качество результата','Коммуникация и сервис','Надёжность и порядок','Цена и ценность'],EDUCATION:['Общее впечатление','Качество обучения','Преподаватели и поддержка','Инфраструктура и условия','Стоимость и результат'],OTHER:['Общее впечатление','Качество результата','Удобство и сервис','Состояние и порядок','Цена и ценность']};return sets[categoryGroup(category)]||sets.OTHER}
    function showError(message){$('error').textContent=message;$('error').classList.remove('hidden')}
    function renderMetrics(data){const keys=['overall','quality','service','cleanliness','value'];const labels=labelsFor(data.category);$('metrics').replaceChildren();keys.forEach((key,index)=>{const value=Number(data.metrics[key]);const row=document.createElement('div');const top=document.createElement('div');top.className='metricTop';const label=document.createElement('span');label.textContent=labels[index];const score=document.createElement('b');score.textContent=`${value.toFixed(0)}/10`;top.append(label,score);const track=document.createElement('div');track.className='track';const fill=document.createElement('div');fill.className='fill';fill.style.width=`${value*10}%`;track.append(fill);row.append(top,track);$('metrics').append(row)})}
    async function load(){if(!ratingId){showError('Оценка не выбрана. Вернитесь в личный кабинет.');return}try{const response=await fetch(`/v1/consumer/ratings/${encodeURIComponent(ratingId)}`,{cache:'no-store'});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||'Не удалось открыть оценку');$('name').textContent=data.name;$('description').textContent=data.description;$('status').textContent=data.rating_type_label;$('score').textContent=Number(data.display_score).toFixed(1);$('scoreLabel').textContent=data.score_label;$('date').textContent=`Опубликовано: ${new Date(data.rated_at).toLocaleString('ru-RU')}`;$('placeLink').href=data.href;renderMetrics(data);if(data.photo){$('noPhoto').classList.add('hidden');$('photoContent').classList.remove('hidden');$('photo').src=data.photo.url;if(data.photo.ai_analysis){$('analysis').textContent=`AI-наблюдение: ${data.photo.ai_analysis}`;$('analysis').classList.remove('hidden')}}$('principle').innerHTML=data.rating_type==='VERIFIED'?`<b>Статус этой записи: Verified.</b> Посещение подтверждено одноразовым QR. ${data.included_in_verified_relyqo_score?'Оценка учитывается детерминированным Score Engine.':'До решения независимой Review оценка не влияет на Score.'} AI не может изменить оценку или Score.`:'<b>Статус этой записи: Community.</b> Оценку поставил потребитель. Она не смешивается с Verified RELYQO Score. AI может описать видимое на фотографии, но не меняет оценку.';$('content').classList.remove('hidden')}catch(error){showError(error.message)}}
    load();
  </script>
</body>
</html>
