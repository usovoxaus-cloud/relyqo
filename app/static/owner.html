<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#082c27"><title>Fregat — Owner QR</title>
  <style>
    :root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#ecfbf6;background:#061a17;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0,#135246 0,transparent 35%),#061a17}.owner{max-width:680px;margin:auto;padding:25px 18px 70px}.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:#73e4bd;color:#05271f;font-size:25px;font-weight:900}.brand{font-weight:900;letter-spacing:.05em}.badge{margin-left:auto;padding:7px 11px;border:1px solid #3f8b78;border-radius:99px;color:#7ee6c2;font-size:10px;font-weight:800}.card{padding:26px;border:1px solid #285247;border-radius:23px;background:rgba(7,39,33,.95);box-shadow:0 22px 55px rgba(0,0,0,.3)}.eyebrow{color:#72dfba;font-size:11px;font-weight:800;letter-spacing:.13em}h1,h2{margin:6px 0 16px}p{line-height:1.5}.muted{color:#8db0a7}.fields{display:grid;gap:12px}label{font-size:13px;color:#b7d3cb}input{width:100%;padding:14px 15px;border:1px solid #397466;border-radius:13px;background:#071f1b;color:#fff;font-size:16px}button{border:0;border-radius:12px;padding:14px 16px;background:#72e2bc;color:#05291f;font-weight:900;cursor:pointer}.logout{padding:8px 11px;background:#173e35;color:#bfe8dc}.account{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding:10px 12px;border-radius:13px;background:#0d312a;color:#bfe8dc;font-size:13px}.error{min-height:20px;color:#ff8f99;font-size:13px}.qrbox{text-align:center;margin-top:22px;padding:20px;background:#fff;border-radius:18px;color:#082c27}.qrbox img{width:min(100%,360px)}.hidden{display:none}@media(max-width:520px){.brand{font-size:13px}.card{padding:21px}}
  </style>
</head>
<body><main class="owner"><header class="top"><span class="logo">R</span><span class="brand">RELYQO OWNER</span><span class="badge">FREGAT</span></header>
  <section id="loginCard" class="card"><p class="eyebrow">ЗАЩИЩЁННЫЙ ВХОД</p><h1>Аккаунт владельца</h1><p class="muted">Войдите, чтобы выпускать одноразовые QR для чеков Fregat.</p><div class="fields"><label>Имя пользователя<input id="username" value="fregat-owner" autocomplete="username"></label><label>Пароль<input id="password" type="password" autocomplete="current-password"></label><button id="login">Войти</button></div><p id="loginError" class="error"></p></section>
  <section id="ownerCard" class="card hidden"><div class="account"><span>Выполнен вход: <b id="accountName"></b></span><button id="logout" class="logout">Выйти</button></div><p class="eyebrow">ОДИН ЧЕК · ОДИН QR · ОДНА ОЦЕНКА</p><h2>Выпустить QR посещения</h2><div class="fields"><label>Номер чека<input id="ref" autocomplete="off" placeholder="Например: FR-2026-00125"></label><button id="issue">Создать одноразовый QR</button></div><p class="muted" style="font-size:12px">QR действует 3 часа и принимается только один раз.</p><p id="error" class="error"></p><div id="result" class="qrbox hidden"><img id="qr" alt="Одноразовый QR посещения"><h3 id="receipt"></h3><p>Покажите QR клиенту после оплаты.</p></div></section>
  </main><script>
    const $=selector=>document.querySelector(selector);
    async function jsonRequest(url,options={}){const response=await fetch(url,options);const data=await response.json();if(!response.ok)throw new Error(data.detail||'Ошибка запроса');return data;}
    function showOwner(user){if(user.role!=='FREGAT_OWNER')throw new Error('Войдите через аккаунт владельца Fregat');$('#accountName').textContent=user.username;$('#loginCard').classList.add('hidden');$('#ownerCard').classList.remove('hidden');}
    async function check(){try{showOwner(await jsonRequest('/v1/auth/me',{cache:'no-store'}));}catch{}}
    $('#login').onclick=async()=>{try{$('#loginError').textContent='';const user=await jsonRequest('/v1/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('#username').value.trim(),password:$('#password').value})});showOwner(user);$('#password').value='';}catch(error){$('#loginError').textContent=error.message;}};
    $('#logout').onclick=async()=>{try{await jsonRequest('/v1/auth/logout',{method:'POST'});}finally{$('#ownerCard').classList.add('hidden');$('#loginCard').classList.remove('hidden');}};
    $('#issue').onclick=async()=>{try{$('#error').textContent='';$('#result').classList.add('hidden');const reference=$('#ref').value.trim();const data=await jsonRequest('/v1/owner/visit-token',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({transaction_reference:reference})});$('#qr').src=data.qr_url;$('#receipt').textContent=`Чек ${reference}`;$('#result').classList.remove('hidden');}catch(error){$('#error').textContent=error.message;}};
    check();
  </script></body></html>
