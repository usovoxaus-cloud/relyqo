<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#082c27"><link rel="stylesheet" href="/static/style.css"><title>Fregat — Owner QR</title><style>.owner{max-width:620px;margin:auto;padding:24px 18px}.qrbox{text-align:center;margin-top:24px;padding:22px;background:white;border-radius:18px;color:#082c27}.qrbox img{width:min(100%,360px)}input{width:100%;padding:15px;border:1px solid #316a60;background:#09231f;border-radius:14px;color:white;font-size:16px}.hint{font-size:12px;color:#779f95}.hidden{display:none}</style></head><body><main class="owner"><header><span class="mark">R</span><b>RELYQO OWNER</b><span class="verified">FREGAT</span></header><section class="card"><p class="eyebrow">ОДИН ЧЕК · ОДИН QR · ОДНА ОЦЕНКА</p><h2>Выпустить QR посещения</h2><label for="ref">Номер чека</label><input id="ref" autocomplete="off" placeholder="Например: FR-2026-00125"><label for="password">Пароль владельца</label><input id="password" type="password" autocomplete="current-password" placeholder="Пароль Owner"><button id="issue">Создать одноразовый QR <span>→</span></button><p class="hint">QR действует 3 часа и принимается только один раз.</p><p id="error" class="error"></p><div id="result" class="qrbox hidden"><img id="qr" alt="Одноразовый QR посещения"><h3 id="receipt"></h3><p>Покажите QR клиенту после оплаты.</p></div></section></main><script src="/static/owner.js"></script></body></html>
