services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relyqo
      POSTGRES_PASSWORD: relyqo
      POSTGRES_DB: relyqo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relyqo"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  postgres_data:

