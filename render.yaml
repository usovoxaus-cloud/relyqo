services:
  - type: web
    name: relyqo
    runtime: docker
    plan: free
    healthCheckPath: /v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: relyqo-db, property: connectionString}
      - key: REDIS_URL
        fromService: {type: redis, name: relyqo-redis, property: connectionString}
      - key: QR_SECRET
        generateValue: true
      - key: OWNER_PASSWORD
        sync: false
      - key: REVIEW_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: PUBLIC_BASE_URL
        value: https://relyqo.onrender.com
      - key: DEMO_MODE
        value: false
  - type: keyvalue
    name: relyqo-redis
    plan: free
    ipAllowList: []
databases:
  - name: relyqo-db
    plan: free
