services:
  - type: web
    name: relyqo
    runtime: docker
    plan: free
    healthCheckPath: /v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: relyqo-db, property: connectionString}
      - key: REDIS_URL
        fromService: {type: redis, name: relyqo-redis, property: connectionString}
      - key: QR_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: https://relyqo.onrender.com
      - key: DEMO_MODE
        value: true
  - type: keyvalue
    name: relyqo-redis
    plan: free
    ipAllowList: []
databases:
  - name: relyqo-db
    plan: free
