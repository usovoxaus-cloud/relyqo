name: Build consumer password recovery

on:
  push:
    branches:
      - consumer-password-recovery-2026-09-14

permissions:
  contents: write

jobs:
  build-consumer-recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: consumer-password-recovery-2026-09-14
          fetch-depth: 0

      - name: Apply consumer recovery changes
        run: python .github/scripts/build_consumer_recovery.py

      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pytest -q
          git diff --check

      - name: Commit recovery feature
        run: |
          rm -f .github/workflows/build-consumer-recovery.yml
          rm -f .github/scripts/build_consumer_recovery.py
          git add -A
          git diff --cached --check
          git config user.name "RELYQO Recovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: add consumer self-service password recovery"
          git push origin HEAD:consumer-password-recovery-2026-09-14
