name: Apply email login support
on:
  push:
    branches: [relyqo-email-login-2026-09-14]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[email-login-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relyqo-email-login-2026-09-14
          fetch-depth: 0
      - name: Implement email or username login
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'app/config.py',
              '        self.owner_password = os.getenv("OWNER_PASSWORD") or None\n',
              '        self.owner_password = os.getenv("OWNER_PASSWORD") or None\n        self.owner_email = (os.getenv("OWNER_EMAIL") or "").strip().lower() or None\n',
          )

          replace_once(
              'app/main.py',
              '''def authenticate(username: str, password: str, db: Session) -> User | None:\n    user = db.scalar(select(User).where(User.username == username))\n    if not user:\n        user = bootstrap_user(username, password, db)\n''',
              '''def authenticate(username: str, password: str, db: Session) -> User | None:\n    login_identifier = username.strip().lower()\n    lookup_username = login_identifier\n    if settings.owner_email and login_identifier == settings.owner_email:\n        lookup_username = "fregat-owner"\n    user = db.scalar(select(User).where(User.username == lookup_username))\n    if not user:\n        user = bootstrap_user(lookup_username, password, db)\n''',
          )

          replace_once(
              'app/main.py',
              '''    username = body.username.strip().lower()\n    if not re.fullmatch(r"[a-z0-9][a-z0-9._-]{2,79}", username):\n        raise HTTPException(\n            422,\n            "Имя: латинские буквы, цифры, точка, дефис или подчёркивание",\n        )\n    if db.scalar(select(User).where(User.username == username)):\n        raise HTTPException(409, "Это имя пользователя уже занято")\n    profile = normalize_business_profile(body)\n''',
              '''    username = body.username.strip().lower()\n    valid_username = re.fullmatch(r"[a-z0-9][a-z0-9._-]{2,79}", username)\n    valid_email = re.fullmatch(\n        r"[a-z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-z0-9-]+(?:\\.[a-z0-9-]+)+",\n        username,\n    )\n    if not (valid_username or valid_email):\n        raise HTTPException(\n            422,\n            "Введите корректный e-mail или имя пользователя",\n        )\n    if db.scalar(select(User).where(User.username == username)):\n        raise HTTPException(409, "Этот e-mail или имя пользователя уже заняты")\n    profile = normalize_business_profile(body)\n''',
          )

          p = Path('app/static/business-owner.html')
          text = p.read_text(encoding='utf-8')
          if 'Имя пользователя' not in text:
              raise SystemExit('Business Owner username label not found')
          text = text.replace('Имя пользователя', 'E-mail или имя пользователя')
          text = text.replace('name="username"', 'name="username" placeholder="name@example.com"')
          p.write_text(text, encoding='utf-8')

          tests = Path('tests/test_api_flow.py')
          test_text = tests.read_text(encoding='utf-8')
          addition = r'''


def test_business_owner_can_register_and_login_with_email_identifier():
    Base.metadata.create_all(engine)
    client = TestClient(app)
    suffix = uuid.uuid4().hex[:8]
    email = f"owner-{suffix}@example.com"
    password = "business-password-123"
    registered = client.post(
        "/v1/business-owner/register",
        json={
            "username": email,
            "password": password,
            "organization_name": f"Email Service {suffix}",
            "category": "PROFESSIONAL_SERVICE",
            "description": "Проверка регистрации и входа владельца бизнеса по e-mail.",
            "address": "Email street 10",
            "city": "Tashkent",
            "country_code": "UZ",
            "phone": "+998 90 100 10 10",
            "website": "https://example.com",
            "latitude": 41.3,
            "longitude": 69.25,
        },
    )
    assert registered.status_code == 200
    assert client.post("/v1/auth/logout").status_code == 200
    logged_in = client.post(
        "/v1/auth/login", json={"username": email.upper(), "password": password}
    )
    assert logged_in.status_code == 200
    assert logged_in.json()["role"] == "BUSINESS_OWNER"
    assert logged_in.json()["username"] == email


def test_legacy_owner_can_login_with_configured_email_alias(monkeypatch):
    Base.metadata.create_all(engine)
    alias = "legacy-owner@example.com"
    monkeypatch.setattr(settings, "owner_email", alias)
    monkeypatch.setattr(settings, "owner_password", OWNER_TEST_PASSWORD)
    with SessionLocal() as db:
        user = db.scalar(select(User).where(User.username == "fregat-owner"))
        if user:
            user.password_hash = password_hash(OWNER_TEST_PASSWORD)
            user.active = True
            user.role = "FREGAT_OWNER"
            db.add(user)
            db.commit()
    response = TestClient(app).post(
        "/v1/auth/login",
        json={"username": alias.upper(), "password": OWNER_TEST_PASSWORD},
    )
    assert response.status_code == 200
    assert response.json()["username"] == "fregat-owner"
    assert response.json()["role"] == "FREGAT_OWNER"
'''
          if 'test_business_owner_can_register_and_login_with_email_identifier' not in test_text:
              tests.write_text(test_text.rstrip() + addition + '\n', encoding='utf-8')
          PY
          git diff --check
      - name: Test
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q
      - name: Cleanup and commit
        run: |
          rm -f .github/workflows/apply-email-login.yml
          git add -A
          git diff --cached --check
          git config user.name "RELYQO Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Support Business Owner login by email [email-login-applied]"
          git push origin HEAD:relyqo-email-login-2026-09-14
