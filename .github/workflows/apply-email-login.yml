name: Apply email login support
on:
  push:
    branches:
      - relyqo-email-login-2026-09-14
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relyqo-email-login-2026-09-14
          fetch-depth: 0
      - name: Implement
        run: |
          python .github/apply_email_login.py
          python .github/fix_stale_tests.py
      - name: Validate
        run: |
          git diff --check
          python -m pip install -e '.[dev]'
          python -m pytest -q
      - name: Commit
        run: |
          rm -f .github/apply_email_login.py .github/fix_stale_tests.py .github/workflows/apply-email-login.yml
          git add -A
          git diff --cached --check
          git config user.name "RELYQO Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Support Business Owner login by email"
          git push origin HEAD:relyqo-email-login-2026-09-14
