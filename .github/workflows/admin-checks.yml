name: Admin workflow checks
on:
  push:
    branches: [main, relyqo-complete-admin-2026-09-18]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture-ci-only
          POSTGRES_DB: relyqo_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fixture -d relyqo_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RELYQO_TEST_PG_DSN: postgresql+psycopg://fixture:fixture-ci-only@127.0.0.1:5432/relyqo_ci
      DATABASE_URL: sqlite:////tmp/relyqo-ci.db
      OPENAI_API_KEY: ''
      RESEND_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q --disable-warnings
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/relyqo-dom linkedom@0.18.12 acorn@8.15.0
      - run: node --test tests/admin-analytics-ui.cjs tests/trust-ui.cjs tests/performance-ui.cjs tests/password-recovery-client.test.cjs tests/admin-workflow-ui.cjs
        env:
          NODE_PATH: /tmp/relyqo-dom/node_modules
  windows-backup:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows backup client
        shell: powershell
        run: '& ./tests/backup-client-windows.ps1'
