name: Validate inline consumer recovery

on:
  push:
    branches:
      - consumer-password-recovery-2026-09-14

permissions:
  contents: write

jobs:
  validate-inline-recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: consumer-password-recovery-2026-09-14
          fetch-depth: 0

      - name: Apply inline recovery handoff
        run: python .github/scripts/add_inline_recovery.py

      - name: Run full tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pytest -q
          git diff --check

      - name: Commit validated changes
        run: |
          git restore relyqo.egg-info || true
          rm -f .github/workflows/add-inline-recovery.yml
          rm -f .github/scripts/add_inline_recovery.py
          git add -A
          git diff --cached --check
          git config user.name "RELYQO Recovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix: show recovery code for inline consumer registration"
          git push origin HEAD:consumer-password-recovery-2026-09-14
